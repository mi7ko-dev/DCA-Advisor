name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/steadyfolio-gitleaks"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install and import the deterministic core
        run: |
          python -m pip install --disable-pip-version-check --no-deps .
          python -c "import steadyfolio; assert callable(steadyfolio.run_committee_workflow)"
          python -m compileall -q src tests tools

      - name: Verify synthetic examples are reproducible
        run: |
          python tools/generate_synthetic_example.py
          python tools/generate_synthetic_intelligence.py
          python tools/generate_synthetic_committee.py
          python tools/generate_synthetic_equity.py
          python tools/generate_synthetic_multi_agent.py
          git diff --exit-code -- examples

      - name: Reproduce and smoke-test the installable plugin
        run: |
          plugin_marketplace="$RUNNER_TEMP/steadyfolio-plugin-marketplace"
          plugin_site="$RUNNER_TEMP/steadyfolio-plugin-site"
          python tools/build_plugin.py --output "$plugin_marketplace"
          diff --recursive --brief \
            .agents/plugins "$plugin_marketplace/.agents/plugins"
          diff --recursive --brief \
            plugins/steadyfolio "$plugin_marketplace/plugins/steadyfolio"
          (
            cd "$plugin_marketplace/plugins/steadyfolio"
            python -B -S -c \
              "import sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd() / 'src')); import steadyfolio; assert callable(steadyfolio.run_committee_workflow); assert callable(steadyfolio.review_equity)"
          )
          python -m pip install --disable-pip-version-check --no-deps \
            --target "$plugin_site" \
            "$plugin_marketplace/plugins/steadyfolio"
          PYTHONPATH="$plugin_site" python -B -S -c \
            "import steadyfolio; assert callable(steadyfolio.run_committee_workflow); assert callable(steadyfolio.review_equity)"

      - name: Reproduce the deterministic release archive
        run: |
          first_archive="$RUNNER_TEMP/release-one/steadyfolio-0.3.0.zip"
          second_archive="$RUNNER_TEMP/release-two/steadyfolio-0.3.0.zip"
          python tools/build_release.py --output "$first_archive"
          python tools/build_release.py --output "$second_archive"
          cmp "$first_archive" "$second_archive"

      - name: Run tests and public-repository safety checks
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tools/run_repository_checks.py --require-gitleaks

      - name: Check patch whitespace
        run: git show --check --format= HEAD
